name: CI - Build & Test

on:
  # pull_request:
  #   branches:
  #     - main

  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # - name: Run unit tests
      #   run: npm run test:unit

      # - name: Run BDD tests
      #   run: npm run test:bdd
      #   continue-on-error: false


      - name: Run Playwright tests
        run: npm run test:playwright
